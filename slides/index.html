<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Kubernetes, The Extensible API</title>

		<!-- reveal.js core styles. `reveal/` is added by the Nix build
		     (flake-parts/slides.nix); it is not in this folder. -->
		<link rel="stylesheet" href="reveal/reset.css" />
		<link rel="stylesheet" href="reveal/reveal.css" />

		<!-- Base theme (dark); custom.css recolours it with Claude's palette.
		     Others: white, league, moon, ... (reveal/theme/ in the build) -->
		<link rel="stylesheet" href="reveal/theme/black.css" />

		<!-- Claude colours + boxes, arrows, layers and route pills -->
		<link rel="stylesheet" href="custom.css" />
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<!-- All slides come from slides.md. The separators are regular
				     expressions matched against whole lines:
				       ---    new slide to the right
				       --     new slide below
				       Note:  speaker notes until the end of the slide -->
				<section
					data-markdown="slides.md"
					data-separator="^---$"
					data-separator-vertical="^--$"
					data-separator-notes="^Note:"
				></section>
			</div>
		</div>

		<script src="reveal/reveal.js"></script>
		<script src="reveal/plugin/markdown.js"></script>
		<script src="reveal/plugin/notes.js"></script>
		<script>
			// All options: https://revealjs.com/config/
			Reveal.initialize({
				hash: true, // keep the slide number in the URL, so refresh stays put
				slideNumber: "h.v", // slide number (and step below it) in the corner
				progress: true,
				transition: "slide", // between slides; one slide can override with data-transition
				backgroundTransition: "fade",
				autoAnimateDuration: 0.8, // data-auto-animate slides morph into each other
				width: 1280,
				height: 720,
				plugins: [RevealMarkdown, RevealNotes],
			});
		</script>
	</body>
</html>
